include:
  - local: consumer-repo-config/ci/templates/EmitEvents.gitlab-ci.yml
  - local: consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
  - local: consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
  - local: consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml
  - local: consumer-repo-config/release/templates/TagMint.gitlab-ci.yml
    inputs:
      changes:
        - consumer-repo-config/**/*
        - lib/**/*
        - .che/**/*
        - Makefile
        - .gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - release
  - trigger

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  CENTRALIZED_ASSETS_PROSE_HUMAN_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_PROSE_HUMAN_REF
  CENTRALIZED_ASSETS_PROSE_AI_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_PROSE_AI_REF
  CENTRALIZED_ASSETS_PROSE_COMMON_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_PROSE_COMMON_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

test-ruby:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
      changes:
        - lib/**/*
        - consumer-repo-config/**/*
        - test/**/*
        - Makefile
  script:
    - make test

emit-events:
  extends: .emit-events
  stage: trigger
