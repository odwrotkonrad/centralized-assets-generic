# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
specsInclude:
  - {specDirPath: ./shared/generic/che, optional: true}

profilesDefinitions:
  genericSetup:
    type: repo-git-untracked
    options:
      autoDiscover: false
    include:
      profiles:
        - specDirPath: ./consumer-repo-config
          profileName: setup
          variables:
            repo: centralized/assets/generic

variablesDefinitions:
  specVariablesDefinitions:
    CENTRALIZED_ASSETS_PROSE_AI_REF: {required: true, scope: recursiveSpecsAndProfiles}
    CENTRALIZED_ASSETS_PROSE_COMMON_REF: {required: true, scope: recursiveSpecsAndProfiles}
    CENTRALIZED_ASSETS_PROSE_HUMAN_REF: {required: true, scope: recursiveSpecsAndProfiles}
    CHE_SCHEMA_REF: {required: true, scope: recursiveSpecsAndProfiles}
    OCI_IMAGES_CI_LINUX_REF: {required: true, scope: recursiveSpecsAndProfiles}
