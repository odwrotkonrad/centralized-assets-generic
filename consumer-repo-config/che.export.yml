# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
profilesDefinitions:
  generic/setup:
    type: repo-git-untracked
    options:
      autoDiscover: false
    include:
      renderTemplates:
        - source: makefile/generic.mk
          dest: ${invokingSpecGitRoot}/shared/generic/make/generic.mk
          options:
            skipAutoGeneratedHeader: true
        - source: files-generation/verify-tracked.zsh
          dest: ${invokingSpecGitRoot}/shared/generic/ci/verify-tracked.zsh
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
        - source: precommit-lefthook/lefthook.yml.tpl
          dest: ${invokingSpecGitRoot}/lefthook.yml
          options:
            skipAutoGeneratedHeader: true
        - source: precommit-lefthook/precommit-changed.zsh
          dest: ${invokingSpecGitRoot}/shared/generic/ci/precommit-changed.zsh
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
        - source: precommit-lefthook/eof-newline-verify.zsh
          dest: ${invokingSpecGitRoot}/shared/generic/ci/eof-newline-verify.zsh
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
        - source: ci
          dest: ${invokingSpecGitRoot}/shared/generic
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source: emit-events.zsh
              dest: ci/emit-events.zsh
              chmod: "0755"
            - source: ruby
              dest: ruby
              <<<:
                - source:
                    - artifact.rb
                    - declaration.rb
                    - event.rb
                    - gitlab.rb
                    - emit_events.rb
                    - che-profiles-covered.rb
        - source: release
          dest: ${invokingSpecGitRoot}/shared/generic/ci
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source:
                - semver-bump.zsh
                - tag-mint.zsh

  generic/filesTracked:
    type: repo-git-tracked
    include:
      makeCopies:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/human
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_HUMAN_REF }}"
            filepath: shared/license/LICENSE
          dest: LICENSE
      renderTemplates:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/human
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_HUMAN_REF }}"
            filepath: "prose/repos/${{ var.repo }}/README.md.ontoRepo.tpl"
          dest: README.md

  generic/filesUntracked:
    type: repo-git-untracked
    include:
      renderTemplates:
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/common
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_COMMON_REF }}"
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source: "prose/repos/${{ var.repo }}/purpose.md"
              dest: assets/docs-agents/purpose.md
            - source: templates/data
              dest: assets/data
              options:
                skipAutoGeneratedHeader: false
              <<<:
                - source: makefile-agents.md.ontoRepo.tpl
                  dest: makefile.agents.md
                - source: repo-structure.md.ontoRepo.tpl
                  dest: repo-structure.md
        - source:
            url: gitlab.com/konradodwrot/centralized/assets/prose/ai
            ref: "${{ var.CENTRALIZED_ASSETS_PROSE_AI_REF }}"
            filepath: "prose/repos/${{ var.repo }}/AGENTS.md.ontoRepo.tpl"
          dest:
            - CLAUDE.md
            - path: AGENTS.md
              options:
                renderReferencedFiles: true

  generic/deps:
    type: repo-git-untracked
    include:
      installPackages:
        - make
        - lefthook
        - yq
        - glab

variablesDefinitions:
  profilesVariablesDefinitions:
    generic/filesTracked:
      repo:
        required: true
        description: "the consumer's project path under the konradodwrot group, names its prose dir"
      CENTRALIZED_ASSETS_PROSE_HUMAN_REF:
        required: true
        description: "centralized/assets/prose/human tag: LICENSE and README source"
    generic/filesUntracked:
      repo:
        required: true
        description: "the consumer's project path under the konradodwrot group, names its prose dir"
      CENTRALIZED_ASSETS_PROSE_COMMON_REF:
        required: true
        description: "centralized/assets/prose/common tag: purpose and data template source"
      CENTRALIZED_ASSETS_PROSE_AI_REF:
        required: true
        description: "centralized/assets/prose/ai tag: AGENTS template source"
    generic/setup:
      lefthookGitlabCiVerify:
        type: boolean
        description: "pre-push hook validates .gitlab-ci.yml"
      lefthookYmlVerify:
        type: boolean
        description: "pre-push hook lints yml files"
      lefthookLocal:
        type: boolean
        description: "rendered lefthook.yml also runs the local-only hooks"
      lefthookEofNewlineVerify:
        type: boolean
        description: "pre-push hook fails on a text file without a newline at end of file"
##[<] 🤖🤖
