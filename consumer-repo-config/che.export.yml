# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
variablesDefinitions:
  profilesVariablesDefinitions:
    setup:
      repo:
        required: true
        description: "the consumer's project path under the konradodwrot group, names its prose dir"
      CHE_SCHEMA_REF:
        required: true
        description: "che-schema release the rendered che.yml header pins"
      CENTRALIZED_ASSETS_PROSE_HUMAN_REF:
        required: true
        description: "centralized/assets/prose/human tag the rendered spec pins"
      CENTRALIZED_ASSETS_PROSE_COMMON_REF:
        required: true
        description: "centralized/assets/prose/common tag the rendered spec pins"
      CENTRALIZED_ASSETS_PROSE_AI_REF:
        required: true
        description: "centralized/assets/prose/ai tag the rendered spec pins"
      lefthookGitlabCiVerify:
        type: boolean
        description: "pre-push hook validates .gitlab-ci.yml"
      lefthookYmlVerify:
        type: boolean
        description: "pre-push hook lints yml files"
      lefthookLocal:
        type: boolean
        description: "rendered lefthook.yml also runs the local-only hooks"
profilesDefinitions:
  setup:
    type: repo-git-untracked
    options:
      autoDiscover: false
    include:
      renderTemplates:
        - source: makefile/generic.mk
          dest: ${invokingSpecGitRoot}/shared/generic/make/generic.mk
          options:
            skipAutoGeneratedHeader: true
        - source: files-generation/consumer.che.yml.tpl
          dest: ${invokingSpecGitRoot}/shared/generic/che/che.yml
          options:
            skipAutoGeneratedHeader: true
        - source: files-generation/verify-tracked.zsh
          dest: ${invokingSpecGitRoot}/shared/generic/ci/verify-tracked.zsh
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
        - source: precommit-lefthook/lefthook.yml.tpl
          dest: ${invokingSpecGitRoot}/lefthook.yml
          options:
            skipAutoGeneratedHeader: true
        - source: precommit-lefthook/precommit-changed.zsh
          dest: ${invokingSpecGitRoot}/shared/generic/ci/precommit-changed.zsh
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
        - source: ci
          dest: ${invokingSpecGitRoot}/shared/generic
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source: emit-events.zsh
              dest: ci/emit-events.zsh
              chmod: "0755"
            - source: ruby
              dest: ruby
              <<<:
                - source:
                    - artifact.rb
                    - declaration.rb
                    - event.rb
                    - gitlab.rb
                    - emit_events.rb
                    - che-profiles-covered.rb
        - source: release
          dest: ${invokingSpecGitRoot}/shared/generic/ci
          chmod: "0755"
          options:
            skipAutoGeneratedHeader: true
          <<<:
            - source:
                - semver-bump.zsh
                - tag-mint.zsh

  deps:
    type: repo-git-untracked
    options:
      autoDiscover: false
    include:
      installPackages:
        - make
        - lefthook
        - yq
        - glab

##[<] 🤖🤖