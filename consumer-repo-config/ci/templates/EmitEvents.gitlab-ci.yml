.emit-events:
  image: $CI_IMAGE
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .repo/*.tpl
        - .repo/deps-graph.yml
        - .repo/upstream.yml
        - .repo/upstream.env
  variables:
    GIT_DEPTH: "2"
    AUTOMATION_PROJECT: konradodwrot/cross-repo/automation
    EMIT_EVENTS_TOKEN: $GRP_KO_PROTECTED_VAR_BOT_EMIT_EVENTS_TOKEN
  script:
    - '[ -x shared/generic/ci/emit-events.zsh ] || ${CHE_BIN:-che} render-templates --profiles=genericSetup'
    - shared/generic/ci/emit-events.zsh
##[<] 🤖🤖
