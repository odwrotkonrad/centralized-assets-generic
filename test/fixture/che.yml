options:
  autoDiscover: true
env:
  TREE: root
profilesDefinitions:
  'base/packages':
    type: host
    installPackages:
      - git
  base:
    type: host
    makeLinks:
      - source: root
  'virt/linux':
    type: host
    include:
      profiles:
        - base
  ontoRepo: # matrix-exempt
    renderTemplates:
      - source: templates
